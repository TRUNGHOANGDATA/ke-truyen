# rescue-blog — công cụ cấp cứu cụm khi KHÔNG SSH vào được.
#
# Sinh ra trong sự cố 2026-09-10: đổi image container `blog` làm pod `tradadata`
# bị Recreate rồi KHÔNG lên lại (0/1 available) — kể cả khi trỏ về image cũ đang
# chạy tốt. Tức pod không recreate nổi vì lý do tầng cụm (không phải code blog),
# mà 2 workflow cũ (`deploy`, `deploy-blog`) chỉ biết set image + rollout status,
# không nhìn thấy pod kẹt vì sao. Workflow này chạy kubectl chẩn đoán + sửa qua SSH.
#
# ⚠️ Repo PUBLIC ⇒ CHỈ in thứ KHÔNG chứa giá trị secret: `get pods`, `get events`,
#    trạng thái container. TUYỆT ĐỐI không `describe pod` đầy đủ (mục Environment
#    có thể lộ giá trị env) và không in log ứng dụng.
#
# Chạy bằng tay (workflow_dispatch), chọn 1 trong các chế độ:
#   diagnose       — chỉ đọc: pods, events, trạng thái từng container, ảnh đang khai.
#   force-restart  — xoá cứng pod của deployment để k8s tạo lại (gỡ pod kẹt
#                    Terminating/Pending), rồi chờ rollout.
#   rollout-undo   — quay Deployment về revision trước đó, rồi chờ rollout.
#   blog-env-check — chỉ đọc: container `blog` nạp env từ Secret nào, và Secret
#                    `tradadata-blog-secret` đang có những TÊN khoá gì (không giá trị).
#   blog-env-set   — ghi GOOGLE_INDEXING_CREDENTIALS + INDEXNOW_KEY vào Secret đó, lấy từ
#                    secret repo BLOG_GOOGLE_DRIVE_CREDENTIALS / BLOG_INDEXNOW_KEY.
#                    KHÔNG bao giờ ghi vào GOOGLE_DRIVE_CREDENTIALS — khoá đó đang phục
#                    vụ upload Drive + log Google Sheet bằng service account khác.
#   blog-resources — chỉ đọc: hạn mức CPU/RAM, volumeMounts (xem `.next/cache` có
#                    volume chưa), node đang chạy, và `kubectl top` nếu cụm có.
#   blog-cpu-4     — nới `limits.cpu` của container blog từ 1 lên 4 core (node có 8).
#                    Sửa pod template ⇒ RECREATE pod ⇒ cả 2 site down ~1-2 phút.
#                    CỐ Ý KHÔNG restart: pod chỉ đọc lại Secret khi được tạo lại, nên để
#                    `deploy-blog` làm MỘT lần recreate lấy cả image mới lẫn env mới —
#                    1 lần downtime thay vì 2.
#   apply-cronjobs — `kubectl apply` file k8s/cronjobs.yaml lấy TRỰC TIẾP từ repo
#                    blog (public) tại ref `blog_ref` (mặc định main). Chỉ tạo/cập
#                    nhật CronJob, KHÔNG đụng Deployment ⇒ KHÔNG downtime. Idempotent.
#                    Dùng khi thêm/sửa lịch chạy nền (vd cron flush-views đếm lượt xem).
#
# Dùng lại secret SSH sẵn có: SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SSH_USER SSH_GATEWAY K8S_HOST

name: rescue-blog

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'diagnose = chỉ xem; fix-pullsecret = làm mới ghcr-secret rồi tạo lại pod; force-restart = xoá pod kẹt tạo lại; rollout-undo = quay về revision trước; blog-env-check = xem env blog lấy từ Secret nào (chỉ đọc); blog-env-set = ghi creds Google + IndexNow vào Secret blog (không restart); apply-cronjobs = kubectl apply k8s/cronjobs.yaml của repo blog (không downtime)'
        required: true
        type: choice
        default: diagnose
        options:
          - diagnose
          - fix-pullsecret
          - force-restart
          - rollout-undo
          - blog-env-check
          - blog-env-set
          - blog-resources
          - blog-cpu-4
          - apply-cronjobs
      blog_ref:
        description: 'apply-cronjobs: ref (nhánh hoặc SHA) của repo tradadata-blog để lấy k8s/cronjobs.yaml. Mặc định main.'
        required: false
        type: string
        default: main

concurrency:
  # Group RIÊNG (không phải ke-truyen-deploy-cum) để chạy được NGAY cả khi một run
  # deploy-blog đang treo ở bước rollout status — các lệnh này độc lập.
  group: bizflow-rescue
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    env:
      NAMESPACE: bizflow
      DEPLOYMENT: tradadata
      BLOG_SECRET: tradadata-blog-secret
    steps:
      - name: Chuẩn bị SSH (ProxyJump qua gateway public vào LAN)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ci_key
          chmod 600 ~/.ssh/ci_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host gw
            HostName ${{ secrets.SSH_GATEWAY }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/ci_key
            IdentitiesOnly yes
          Host cp
            HostName ${{ secrets.K8S_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/ci_key
            IdentitiesOnly yes
            ProxyJump gw
          EOF
          chmod 600 ~/.ssh/config

      - name: Chẩn đoán (luôn chạy, an toàn)
        run: |
          echo "===== PODS ====="
          ssh cp "kubectl get pods -n $NAMESPACE -o wide"
          echo "===== DEPLOYMENT ====="
          ssh cp "kubectl get deploy $DEPLOYMENT -n $NAMESPACE -o wide"
          echo "===== ẢNH ĐANG KHAI (image mỗi container) ====="
          ssh cp "kubectl get deploy $DEPLOYMENT -n $NAMESPACE -o jsonpath='{range .spec.template.spec.containers[*]}{.name}={.image}{\"\n\"}{end}'"
          echo ""
          echo "===== TRẠNG THÁI TỪNG CONTAINER (lý do waiting nếu có) ====="
          ssh cp "kubectl get pods -n $NAMESPACE -l app=$DEPLOYMENT -o jsonpath='{range .items[*]}POD {.metadata.name} phase={.status.phase}{\"\n\"}{range .status.containerStatuses[*]}  {.name} ready={.ready} restarts={.restartCount} state={.state}{\"\n\"}{end}{end}'"
          echo ""
          echo "===== EVENTS (40 dòng cuối — nói thẳng lý do kẹt) ====="
          ssh cp "kubectl get events -n $NAMESPACE --sort-by=.lastTimestamp | tail -40"

      - name: Sửa — làm mới ghcr-secret (PAT hết hạn gây 403 ImagePullBackOff)
        if: ${{ inputs.action == 'fix-pullsecret' }}
        env:
          PAT: ${{ secrets.GHCR_PULL_PAT }}
          GH_USER: TRUNGHOANGDATA
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::Thiếu secret GHCR_PULL_PAT — khai ở ke-truyen > Settings > Secrets and variables > Actions (PAT classic, scope read:packages)."
            exit 1
          fi
          # Dựng dockerconfigjson NGAY TẠI RUNNER; PAT được GitHub che trong log.
          # KHÔNG echo các biến này. Đẩy manifest qua stdin -> kubectl, không lộ ra
          # args/log ở máy remote.
          AUTH=$(printf '%s:%s' "$GH_USER" "$PAT" | base64 -w0)
          DOCKERCFG=$(printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$AUTH" | base64 -w0)
          printf '%s\n' \
            "apiVersion: v1" \
            "kind: Secret" \
            "metadata:" \
            "  name: ghcr-secret" \
            "  namespace: $NAMESPACE" \
            "type: kubernetes.io/dockerconfigjson" \
            "data:" \
            "  .dockerconfigjson: $DOCKERCFG" \
            | ssh cp "kubectl apply -n $NAMESPACE -f -" >/dev/null
          echo "Đã ghi lại secret ghcr-secret."
          # Đảm bảo deployment tham chiếu ghcr-secret (idempotent).
          ssh cp "kubectl patch deployment $DEPLOYMENT -n $NAMESPACE --type merge -p '{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"ghcr-secret\"}]}}}}'"
          # Cập nhật Secret KHÔNG tự restart pod -> phải xoá pod để pull lại với cred mới.
          ssh cp "kubectl delete pod -n $NAMESPACE -l app=$DEPLOYMENT --force --grace-period=0 || true"
          ssh cp "kubectl rollout status deployment/$DEPLOYMENT -n $NAMESPACE --timeout=6m"

      - name: Sửa — force-restart (xoá pod kẹt, tạo lại)
        if: ${{ inputs.action == 'force-restart' }}
        run: |
          echo "Xoá cứng pod của $DEPLOYMENT để k8s tạo lại..."
          ssh cp "kubectl delete pod -n $NAMESPACE -l app=$DEPLOYMENT --force --grace-period=0 || true"
          ssh cp "kubectl rollout status deployment/$DEPLOYMENT -n $NAMESPACE --timeout=6m"

      - name: Sửa — rollout undo (quay về revision trước)
        if: ${{ inputs.action == 'rollout-undo' }}
        run: |
          ssh cp "kubectl rollout undo deployment/$DEPLOYMENT -n $NAMESPACE"
          ssh cp "kubectl rollout status deployment/$DEPLOYMENT -n $NAMESPACE --timeout=6m"

      - name: Sửa — apply cronjobs của repo blog (không downtime)
        if: ${{ inputs.action == 'apply-cronjobs' }}
        env:
          BLOG_REF: ${{ inputs.blog_ref }}
        run: |
          # Lấy manifest TRỰC TIẾP từ repo blog (public) rồi đẩy qua stdin -> kubectl.
          # Chỉ tạo/cập nhật CronJob (idempotent), KHÔNG đụng Deployment nên KHÔNG
          # có pod nào bị recreate ⇒ không downtime.
          RAW="https://raw.githubusercontent.com/TRUNGHOANGDATA/tradadata-blog/${BLOG_REF}/k8s/cronjobs.yaml"
          echo "Lấy manifest: $RAW"
          curl -fsSL "$RAW" -o /tmp/cronjobs.yaml
          echo "===== CronJob khai trong manifest ====="
          grep -E '^\s+name:\s+tradadata-blog' /tmp/cronjobs.yaml || true
          echo "===== apply ====="
          ssh cp "kubectl apply -n $NAMESPACE -f -" < /tmp/cronjobs.yaml
          rm -f /tmp/cronjobs.yaml
          echo "===== CronJob sau khi apply ====="
          ssh cp "kubectl get cronjob -n $NAMESPACE"

      - name: Xem env của container blog (chỉ đọc — CHỈ in TÊN, không in giá trị)
        if: ${{ inputs.action == 'blog-env-check' || inputs.action == 'blog-env-set' }}
        run: |
          echo "===== envFrom: Secret/ConfigMap nào được nạp CẢ KHỐI vào container blog ====="
          echo "(có dòng tradadata-blog-secret ở đây ⇒ thêm khoá vào Secret là container tự có)"
          ssh cp "kubectl get deploy $DEPLOYMENT -n $NAMESPACE -o jsonpath='{range .spec.template.spec.containers[?(@.name==\"blog\")].envFrom[*]}secretRef={.secretRef.name} configMapRef={.configMapRef.name}{\"\n\"}{end}'"
          echo ""
          echo "===== env khai LẺ bằng secretKeyRef (tên biến <- tên Secret/khoá) ====="
          echo "(nếu env khai kiểu này thì thêm khoá vào Secret là CHƯA đủ — phải sửa cả Deployment)"
          ssh cp "kubectl get deploy $DEPLOYMENT -n $NAMESPACE -o jsonpath='{range .spec.template.spec.containers[?(@.name==\"blog\")].env[*]}{.name} <- {.valueFrom.secretKeyRef.name}/{.valueFrom.secretKeyRef.key}{\"\n\"}{end}'"
          echo ""
          echo "===== TÊN các khoá đang có trong Secret $BLOG_SECRET ====="
          # Lấy JSON về runner rồi `jq keys` — chỉ in tên khoá, giá trị không bao giờ ra log.
          ssh cp "kubectl get secret $BLOG_SECRET -n $NAMESPACE -o json" | jq -r '.data | keys[]'

      - name: Sửa — ghi GOOGLE_INDEXING_CREDENTIALS + INDEXNOW_KEY vào Secret blog
        if: ${{ inputs.action == 'blog-env-set' }}
        env:
          CREDS: ${{ secrets.BLOG_GOOGLE_DRIVE_CREDENTIALS }}
          INDEXNOW: ${{ secrets.BLOG_INDEXNOW_KEY }}
          # Tuỳ chọn: chỉ khai khi cần thay refresh token Google Drive (token cũ hết
          # hạn / bị thu hồi). Không khai thì bước này không đụng tới khoá đang có.
          REFRESH: ${{ secrets.BLOG_GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          if [ -z "$CREDS" ] || [ -z "$INDEXNOW" ]; then
            echo "::error::Thiếu BLOG_GOOGLE_DRIVE_CREDENTIALS hoặc BLOG_INDEXNOW_KEY — khai ở ke-truyen > Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -n "$REFRESH" ]; then
            echo "Có BLOG_GOOGLE_OAUTH_REFRESH_TOKEN ⇒ sẽ ghi thêm GOOGLE_OAUTH_REFRESH_TOKEN."
          else
            echo "Không có BLOG_GOOGLE_OAUTH_REFRESH_TOKEN ⇒ giữ nguyên khoá refresh token hiện tại."
          fi
          # Dựng patch NGAY TẠI RUNNER rồi đẩy qua stdin. KHÔNG echo, và KHÔNG đưa giá trị
          # lên dòng lệnh — args của lệnh remote hiện trong `ps` của control plane.
          # `--type merge` chỉ thêm/ghi đè 2 khoá này; các khoá khác trong Secret
          # (EMAIL_USER, EMAIL_PASS, CRON_SECRET...) giữ nguyên.
          #
          # ⚠️ Ghi vào GOOGLE_INDEXING_CREDENTIALS, KHÔNG phải GOOGLE_DRIVE_CREDENTIALS.
          # Khoá Drive đang phục vụ upload Google Drive + ghi log Google Sheet bằng một
          # service account KHÁC (Sheet chỉ share cho SA đó). Ghi đè lên nó là làm Sheet
          # log chết im lặng. Route index đọc biến riêng này trước, chỉ fallback về khoá
          # Drive khi không khai.
          jq -n --arg a "$CREDS" --arg b "$INDEXNOW" --arg c "$REFRESH" \
            '{stringData: ({GOOGLE_INDEXING_CREDENTIALS: $a, INDEXNOW_KEY: $b}
                           + (if $c == "" then {} else {GOOGLE_OAUTH_REFRESH_TOKEN: $c} end))}' \
            | ssh cp "cat > /tmp/blog-env-patch.json && kubectl -n $NAMESPACE patch secret $BLOG_SECRET --type merge --patch-file /tmp/blog-env-patch.json > /dev/null; rc=\$?; rm -f /tmp/blog-env-patch.json; exit \$rc"
          echo "Đã ghi 2 khoá vào Secret $BLOG_SECRET."
          echo "===== TÊN khoá sau khi ghi ====="
          ssh cp "kubectl get secret $BLOG_SECRET -n $NAMESPACE -o json" | jq -r '.data | keys[]'
          echo ""
          echo "⚠️ Secret mới KHÔNG tự vào pod đang chạy — pod chỉ đọc lại khi được tạo lại."
          echo "   ĐỪNG restart ở đây. Chạy workflow deploy-blog với SHA mới: một lần"
          echo "   recreate lấy cả image mới lẫn env mới (1 lần downtime, không phải 2)."

      - name: Xem hạn mức CPU/RAM và volume của container blog (chỉ đọc)
        if: ${{ inputs.action == 'blog-resources' }}
        # Vì sao cần: Next Image optimizer encode ảnh bằng CPU của pod. Đo
        # 10/09/2026: cùng một ảnh hero, máy dev encode 208ms mà pod mất 1-5s
        # ⇒ nghi pod bị bó CPU. Không đoán — đọc `resources` ra xem.
        # Và xem luôn có volume nào mount vào `.next/cache` chưa: nếu chưa thì
        # mỗi lần recreate pod là mất sạch cache ảnh, phải encode lại từ đầu.
        run: |
          echo "===== resources (requests/limits) từng container ====="
          ssh cp "kubectl get deploy $DEPLOYMENT -n $NAMESPACE -o jsonpath='{range .spec.template.spec.containers[*]}{.name}: requests={.resources.requests} limits={.resources.limits}{\"\n\"}{end}'"
          echo ""
          echo "===== volumeMounts của container blog (tìm .next/cache) ====="
          ssh cp "kubectl get deploy $DEPLOYMENT -n $NAMESPACE -o jsonpath='{range .spec.template.spec.containers[?(@.name==\"blog\")].volumeMounts[*]}{.name} -> {.mountPath}{\"\n\"}{end}'"
          echo ""
          echo "===== volumes khai ở pod ====="
          ssh cp "kubectl get deploy $DEPLOYMENT -n $NAMESPACE -o jsonpath='{range .spec.template.spec.volumes[*]}{.name}{\"\n\"}{end}'"
          echo ""
          echo "===== node đang chạy + CPU của node ====="
          ssh cp "kubectl get pods -n $NAMESPACE -l app=$DEPLOYMENT -o jsonpath='{range .items[*]}{.metadata.name} node={.spec.nodeName}{\"\n\"}{end}'"
          ssh cp "kubectl get nodes -o custom-columns=TEN:.metadata.name,CPU:.status.capacity.cpu,RAM:.status.capacity.memory"
          echo ""
          echo "===== dùng thực tế (bỏ qua nếu cụm không có metrics-server) ====="
          ssh cp "kubectl top pod -n $NAMESPACE -l app=$DEPLOYMENT --containers 2>/dev/null || echo '  (khong co metrics-server)'"

      - name: Sửa — nâng hạn mức CPU của container blog lên 4 core
        if: ${{ inputs.action == 'blog-cpu-4' }}
        # Vì sao: Next Image optimizer encode ảnh bằng sharp/libvips — thư viện ĐA LUỒNG.
        # Container `blog` đang bị bó `limits.cpu: 1` trong khi node k8snode2 có 8 core.
        # Đo 10/09/2026: cùng một ảnh hero, máy dev encode 208ms, pod mất 1-5s. Và khi
        # 3-4 request ảnh đến cùng lúc thì chúng chia nhau đúng 1 core đó.
        # `requests` giữ nguyên 50m — chỉ nới TRẦN, không giữ chỗ thêm, nên không đẩy
        # pod nào khỏi node. `ke-truyen` vẫn bị bó ở 500m nên không giành được.
        #
        # ⚠️ Sửa `resources` là sửa pod template ⇒ k8s RECREATE pod ⇒ cả blog và
        # ke-truyen down ~1-2 phút.
        # Muốn quay lui: chạy lại `rollout-undo`, hoặc patch về `"cpu":"1"`.
        #
        # ⚠️ ĐỪNG chạy song song với deploy-blog. Workflow này dùng concurrency group
        # RIÊNG (`bizflow-rescue`) — cố ý, để cứu được cụm khi một run deploy đang treo
        # — nên GitHub KHÔNG chặn hai run cùng lúc. Ngày 10/09/2026 chạy hai lệnh liền
        # nhau: bản vá này recreate pod đúng lúc smoke test của deploy-blog đang đo,
        # 8 đường trả 502, run deploy đỏ và bước làm ấm cache bị skip. Site không hỏng,
        # nhưng mất một run và phải làm ấm tay.
        # Vì vậy bước dưới TỰ CHẶN nếu đang có rollout dở. Thứ tự đúng: chạy mode này,
        # chờ xanh, RỒI mới chạy deploy-blog.
        run: |
          echo "Kiểm xem có rollout nào đang dở không (đừng chen vào deploy-blog)..."
          if ! ssh cp "kubectl rollout status deployment/$DEPLOYMENT -n $NAMESPACE --timeout=20s"; then
            echo "::error::Đang có rollout dở trên deployment/$DEPLOYMENT. Chờ nó xong rồi chạy lại — chen vào là pod recreate giữa lúc deploy đang nghiệm thu."
            exit 1
          fi
          echo "Trước:"
          ssh cp "kubectl get deploy $DEPLOYMENT -n $NAMESPACE -o jsonpath='{range .spec.template.spec.containers[*]}{.name}: limits={.resources.limits}{\"\n\"}{end}'"
          # Strategic merge khớp container theo `name`, nên KHÔNG đụng tới container
          # ke-truyen và không cần khai lại image.
          ssh cp "kubectl patch deployment $DEPLOYMENT -n $NAMESPACE --type strategic -p '{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"blog\",\"resources\":{\"requests\":{\"cpu\":\"50m\",\"memory\":\"256Mi\"},\"limits\":{\"cpu\":\"4\",\"memory\":\"1Gi\"}}}]}}}}'"
          ssh cp "kubectl rollout status deployment/$DEPLOYMENT -n $NAMESPACE --timeout=6m"
          echo "Sau:"
          ssh cp "kubectl get deploy $DEPLOYMENT -n $NAMESPACE -o jsonpath='{range .spec.template.spec.containers[*]}{.name}: limits={.resources.limits}{\"\n\"}{end}'"

      - name: Chẩn đoán lại sau khi sửa
        if: ${{ inputs.action != 'diagnose' }}
        run: |
          echo "===== PODS (sau sửa) ====="
          ssh cp "kubectl get pods -n $NAMESPACE -o wide"
          echo "===== HEALTH ====="
          curl -s -m 20 -o /dev/null -w "blog http=%{http_code}\n" https://www.tradadata.com/api/health || true

      - name: Dọn khoá SSH
        if: always()
        run: rm -f ~/.ssh/ci_key
