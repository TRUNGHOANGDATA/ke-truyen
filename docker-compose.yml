services:
  app:
    build: .
    restart: unless-stopped
    # Đọc .env bằng node --env-file (đọc nguyên văn) thay vì env_file của Compose,
    # vì Compose nội suy dấu $ làm hỏng bcrypt hash trong PASSWORD_HASH.
    command: node --env-file=.env src/server.js
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./.env:/app/.env:ro
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
